[package]
name = "geo-philly"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
all = "deny"
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[dependencies]
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rayon = "1.11"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls-no-alpn", "query"] }
rstar = "0.12"
serde = { version = "1", features = ["derive"] }
tiny-skia = "0.11"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
