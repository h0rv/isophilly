[project]
name = "geo-philly"
version = "0.1.0"
description = "geo-philly data ingest for the native tile server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "shapely>=2.0",
    "geopandas>=1.0",
    "httpx>=0.28",
    "pyarrow>=20",
    "pyogrio>=0.10",
    "pyproj>=3.7",
]

[dependency-groups]
dev = [
    "poethepoet",
    "ruff",
    "ty",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "geo_philly_ingest"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.12"

[tool.poe.tasks]
test-python = { cmd = "python -m unittest discover -s tests", use_exec = true }
check-python = { cmd = "bash -lc 'ruff format --check src scripts tests && ruff check src scripts tests && ty check src scripts tests && python -m unittest discover -s tests'", use_exec = true }
check-rust = { cmd = "bash -lc 'cargo fmt --check && cargo clippy --all-targets --all-features -- -D warnings && cargo test --all-targets --all-features && cargo build --release --locked'", use_exec = true }
check-web = { cmd = "npm run check", use_exec = true }
audit = { cmd = "bash -lc 'uv audit --locked --preview-features audit-command && npm audit --audit-level=high && cargo deny check'", use_exec = true }
check = { cmd = "bash -lc 'poe check-python && poe check-web && poe check-rust && poe audit'", use_exec = true }
ingest = { cmd = "python -m geo_philly_ingest.ingest", use_exec = true }
neighborhoods = { cmd = "python scripts/build_neighborhoods.py", use_exec = true }
serve = { cmd = "cargo run --release --locked -- serve --port 3000", use_exec = true }
visual = { cmd = "bash -lc 'cargo build --release --locked && npm run visual'", use_exec = true }

[tool.poe.executor]
type = "simple"

[tool.poe.tasks.prebuild]
cmd = "cargo run --release --locked -- prebuild"
help = "Build the tile pyramid; pass --jobs N to override worker count"
use_exec = true
