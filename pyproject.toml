[project]
name = "geo-philly"
version = "0.1.0"
description = "geo-philly data ingest for the native tile server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "shapely>=2.0",
    "geopandas>=1.0",
    "httpx>=0.28",
    "pyarrow>=20",
    "pyogrio>=0.10",
]

[dependency-groups]
dev = [
    "poethepoet",
    "ruff",
    "ty",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "geo_philly_ingest"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.12"

[tool.poe.tasks]
test-python = "python -m unittest discover -s tests"
check-python = { shell = "ruff format --check src scripts tests && ruff check src scripts tests && ty check src scripts tests && python -m unittest discover -s tests" }
check-rust = { shell = "cargo fmt --check && cargo clippy --all-targets --all-features -- -D warnings && cargo test --all-targets --all-features && cargo build --release --locked" }
check-web = "npm run check"
audit = { shell = "uv audit --locked --preview-features audit-command && npm audit --audit-level=high && cargo deny check" }
check = { shell = "poe check-python && poe check-web && poe check-rust && poe audit" }
ingest = "python -m geo_philly_ingest.ingest"
prebuild = "cargo run --release -- prebuild --max-zoom 5 --texture pixel"
prebuild-full = "cargo run --release -- prebuild --max-zoom 5 --texture full"
serve = "cargo run --release -- serve --port 3000 --texture pixel"
serve-full = "cargo run --release -- serve --port 3000 --texture full"
serve-plain = "cargo run --release -- serve --port 3000 --texture none"
visual = { shell = "cargo build --release --locked && GEO_PHILLY_TEXTURE=pixel npm run visual" }
visual-full = { shell = "cargo build --release --locked && GEO_PHILLY_TEXTURE=full npm run visual" }
