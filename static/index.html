<!doctype html>
<html lang="en">
<head>

  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }

    header { top: 0; left: 0; right: 0; display: flex; gap: 1rem; align-items: baseline; padding: .65rem 1rem; }
    h1 { margin: 0; font-size: 1rem; letter-spacing: -.02em; }

    details { margin-left: auto; position: relative; font-size: .75rem; }
    summary { cursor: pointer; color: #c7bfb2; }

  <script src="/app.js?v=20260826-2" defer></script>

  <header>
    <h1>geo-philly</h1>

    <button id="home">City Hall</button>
    <details>

      <div class="legend">
        <div><i style="background:#9c4e36"></i>rowhouses</div>
        <div><i style="background:#76778c"></i>towers</div>

        <div><i style="background:#779267"></i>parks</div>

      </div>
    </details>
  </header>
  <canvas id="map"></canvas>

</html>
